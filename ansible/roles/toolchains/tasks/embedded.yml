---
- name: Install ARM bare-metal and AArch64 cross-compilers
  community.general.pacman:
    name: "{{ pacman_arm_packages }}"
    state: present
  become: true
  tags:
    - arm
    - arm-avr

- name: Install AVR cross-compilers and flashing tools
  community.general.pacman:
    name: "{{ pacman_avr_packages }}"
    state: present
  become: true
  tags:
    - avr
    - arm-avr

- name: Install RISC-V cross-compilers and QEMU
  community.general.pacman:
    name: "{{ pacman_riscv_packages }}"
    state: present
  become: true
  tags:
    - riscv
