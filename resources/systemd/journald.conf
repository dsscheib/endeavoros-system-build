# Installed as /etc/systemd/journald.conf.d/zz-eos-workstation.conf.
[Journal]
# Keep enough history to investigate a crash from previous days.
SystemMaxUse=4G
# Stop one flooding unit from rotating everyone else's history away. journald
# scales the burst by free disk space (about 3x with tens of GiB free).
RateLimitIntervalSec=30s
RateLimitBurst=200
